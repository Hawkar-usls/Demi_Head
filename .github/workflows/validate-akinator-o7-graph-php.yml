name: Validate Akinator O7 Graph PHP

on:
  push:
    paths:
      - 'probes/akinator_o7_graph_php_positive_control_probe.py'
      - 'docs/TOPA_AKINATOR_O7_GRAPH_PHP_POSITIVE_CONTROL.md'
      - 'docs/TOPA_PVSNP_EVENT_JOURNAL_2026-08-25.json'
      - '.github/workflows/validate-akinator-o7-graph-php.yml'
  pull_request:
    paths:
      - 'probes/akinator_o7_graph_php_positive_control_probe.py'
      - 'docs/TOPA_AKINATOR_O7_GRAPH_PHP_POSITIVE_CONTROL.md'
      - 'docs/TOPA_PVSNP_EVENT_JOURNAL_2026-08-25.json'
      - '.github/workflows/validate-akinator-o7-graph-php.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run O7 graph-PHP positive-control replay
        run: python probes/akinator_o7_graph_php_positive_control_probe.py
      - name: Validate JSON journal
        run: python -m json.tool docs/TOPA_PVSNP_EVENT_JOURNAL_2026-08-25.json >/dev/null
      - name: Claim ceiling reminder
        run: |
          echo 'CI validates finite B2/strengthening mechanics only.'
          echo 'Cook polynomial ER is an external theorem.'
          echo 'Universal schema selection remains OPEN.'
          echo 'P_VS_NP = OPEN'
