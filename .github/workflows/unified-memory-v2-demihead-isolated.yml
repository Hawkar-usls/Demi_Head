name: DemiHead Unified Memory v2 read-only contract
on:
  pull_request:
    paths:
      - 'tools/unified_memory_v2_bridge.py'
      - 'tests/test_unified_memory_v2_bridge.py'
      - 'docs/UNIFIED_MEMORY_V2_DEMIURGE_BRIDGE.md'
      - '.github/workflows/unified-memory-v2-demihead-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert bridge contract and run bounded test fixtures
        run: |
          python -m unittest discover -s tests -p test_unified_memory_v2_bridge.py -v
          python - <<'PY'
          from pathlib import Path
          s=Path('tools/unified_memory_v2_bridge.py').read_text(encoding='utf-8')
          assert 'sqlite3.connect' in s and '?mode=ro&immutable=1' in s
          assert 'EXPECTED_SOURCE_PIN_REQUIRED' in s
          assert 'external_effect_permitted":False' in s
          assert 'mass_effect_budget_delta":0' in s
          print('DEMIHEAD_UNIFIED_MEMORY_V2_READONLY_PASS')
          PY
