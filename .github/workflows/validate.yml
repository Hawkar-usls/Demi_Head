name: Validate repository contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate contracts and documentation
        run: python tools/validate_repository.py

      - name: Run reference tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic KETO fixture
        run: python tools/keto_reference.py examples/case_echo_collapse.json --output /tmp/keto-result.json

      - name: Run bicameral hemisphere bridge self-test
        run: python tools/hemisphere_bridge.py --self-test --output /tmp/hemisphere-self-test.json

      - name: Bind frozen HRain and iNaiHR example packets
        run: |
          python tools/hemisphere_bridge.py \
            --left examples/hemisphere_left_hrain.json \
            --right examples/hemisphere_right_inaihr.json \
            --output /tmp/bicameral-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/bicameral-result.json').read_text(encoding='utf-8'))
          assert result['status'] == 'BICAMERAL_OVERLAP_PRESENT'
          assert result['comparison']['shared_semantic_keys'] == ['context', 'evidence']
          assert result['comparison']['automatic_graph_merge_performed'] is False
          assert result['routing']['external_effect_permitted'] is False
          assert result['routing']['direct_cross_hemisphere_write_permitted'] is False
          assert result['claim_ceiling']['truth_claim_made'] is False
          assert result['claim_ceiling']['agreement_is_truth'] is False
          assert result['claim_ceiling']['hemisphere_count_is_authority'] is False
          assert result['claim_ceiling']['authority_delta'] == 0
          assert result['claim_ceiling']['mass_effect_budget_delta'] == 0
          print('BICAMERAL_BRIDGE=PASS')
          print('BOTH_HEMISPHERES_AGREE_IS_TRUTH=false')
          print('DIRECT_CROSS_HEMISPHERE_WRITE=false')
          PY

      - name: Verify live bicameral console remains request-bound and read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          console = Path('examples/bicameral_console.html').read_text(encoding='utf-8')
          transport = Path('examples/bicameral-transport.js').read_text(encoding='utf-8')
          assert 'https://hawkar-usls.github.io/Hrain/demihead.html' in console
          assert 'https://hawkar-usls.github.io/iNaiHR/demihead.html' in console
          assert '<script src="./bicameral-transport.js"></script>' in console
          assert 'transport.buildRequest(requestId)' in console
          assert 'transport.ingestEnvelope' in console
          assert 'transport.evaluate' in console
          assert 'crypto.randomUUID' in console
          assert 'crypto.getRandomValues' in console
          assert 'Math.random' not in console
          assert 'postMessage(request, transport.PAGES_ORIGIN)' in console
          assert "STALE_OR_REPLAYED_REQUEST" in transport
          assert "LATE_AFTER_DEADLINE" in transport
          assert "DUPLICATE_HEMISPHERE_RESPONSE" in transport
          assert "hemisphere/source-frame mismatch" in transport
          for forbidden in (
              'localStorage.setItem',
              'localStorage.removeItem',
              'localStorage.clear',
              'fetch(',
              'XMLHttpRequest',
              'api.github.com/repos/',
          ):
              assert forbidden not in console, forbidden
          assert "BOTH_HEMISPHERES_AGREE != TRUTH" in console
          assert "HEMISPHERE_COUNT != AUTHORITY" in console
          assert "REQUEST_ID_ECHO != AUTHENTICATION" in console
          assert "DIRECT_CROSS_HEMISPHERE_WRITE = false" in console
          assert "external_effect_permitted: false" in transport
          assert "direct_cross_hemisphere_write_permitted: false" in transport
          assert "agreement_is_truth: false" in transport
          assert "authority_delta: 0" in transport
          assert "mass_effect_budget_delta: 0" in transport
          print('BICAMERAL_CONSOLE_REQUEST_BOUND_READ_ONLY=PASS')
          print('REQUEST_ID_IS_AUTHENTICATION=false')
          print('CROSS_HEMISPHERE_WRITE=false')
          PY

      - name: Verify frozen bicameral transport corpus hash before execution
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          corpus = json.loads(Path('holdout/bicameral_transport_v1/frozen_corpus.json').read_text(encoding='utf-8'))
          raw = json.dumps(corpus['freeze_payload'], ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == 'd33077fbd0d244bf0ae6d678894bdc9a8eddcf0d779ce11b85e39eeff6143883'
          assert corpus['freeze_sha256'] == actual
          assert corpus['freeze_payload']['frozen_before_first_execution'] is True
          assert len(corpus['freeze_payload']['cases']) == 18
          print('BICAMERAL_TRANSPORT_FROZEN_BEFORE_EXECUTION=true')
          print('FREEZE_SHA256', actual)
          PY

      - name: Run frozen bicameral transport adversarial holdout
        run: |
          node tools/test-bicameral-transport-holdout.js \
            holdout/bicameral_transport_v1/frozen_corpus.json \
            /tmp/bicameral-transport-holdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/bicameral-transport-holdout.json').read_text(encoding='utf-8'))
          assert result['status'] == 'PASS'
          assert result['frozen_case_count'] == 18
          assert result['passed'] == 18
          assert result['failed'] == 0
          metrics = result['metrics']
          assert metrics['measurement_kind'] == 'FROZEN_SYNTHETIC_EVENT_TRACE_NOT_WALL_CLOCK'
          assert metrics['sample_count'] > 0
          assert metrics['p50_ms'] <= metrics['p95_ms'] <= metrics['p99_ms']
          ceiling = result['claim_ceiling']
          assert ceiling['real_browser_network_latency_measured'] is False
          assert ceiling['production_readiness_established'] is False
          assert ceiling['request_id_is_authentication'] is False
          assert ceiling['independent_evidence_roots_established'] is False
          assert ceiling['truth_from_agreement_established'] is False
          assert ceiling['authority_delta'] == 0
          assert ceiling['mass_effect_budget_delta'] == 0
          print('FROZEN_BICAMERAL_TRANSPORT_HOLDOUT=PASS')
          print('REAL_BROWSER_NETWORK_LATENCY_MEASURED=false')
          print('REQUEST_ID_IS_AUTHENTICATION=false')
          PY

      - name: Check out exact frozen HRain hemisphere implementation
        uses: actions/checkout@v7
        with:
          repository: Hawkar-usls/Hrain
          ref: c1c4e61e18e1adf15ed1d43da51129b262119985
          path: _frozen/Hrain
          persist-credentials: false

      - name: Check out exact frozen iNaiHR hemisphere implementation
        uses: actions/checkout@v7
        with:
          repository: Hawkar-usls/iNaiHR
          ref: a79cc9affa733bf3d2d6b0ed4815fccf938f3292
          path: _frozen/iNaiHR
          persist-credentials: false

      - name: Verify exact frozen hemisphere sidecars match transport contract
        run: node tools/verify-frozen-hemisphere-sidecars.js _frozen

      - name: Run deterministic +/+ recenter self-test
        run: python tools/plus_plus_recenter.py --self-test --output /tmp/plus-plus-self-test.json

      - name: Run deterministic +/+ recenter trace
        run: python tools/plus_plus_recenter.py --input-csv examples/plus_plus_recenter_trace.csv --output /tmp/plus-plus-trace.json

      - name: Run deterministic Third Wish activation self-test
        run: python tools/third_wish_catalog.py --self-test --output /tmp/third-wish-self-test.json

      - name: Inspect high-impact Third Wish hold path
        run: python tools/third_wish_catalog.py --request GITHUB.DESTRUCTIVE --output /tmp/third-wish-high-impact.json

      - name: Run epistemic execution gate self-test
        run: python tools/epistemic_execution_gate.py --self-test --output /tmp/epistemic-execution-self-test.json

      - name: Reject model-only fake hash verification fixture
        run: |
          python tools/epistemic_execution_gate.py --assess examples/epistemic_model_only_hash_claim.json --output /tmp/model-only-hash-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/model-only-hash-result.json').read_text())
          assert result['evidence_state'] == 'EVIDENCE_INSUFFICIENT'
          assert result['definitive_claim_permitted'] is False
          assert 'DO_NOT_GUESS_A_VALUE' in result['response_policy']
          PY

      - name: Exercise real SHA-256 execution path
        run: python tools/epistemic_execution_gate.py --sha256-text JANUS --output /tmp/real-sha256-receipt.json

      - name: Run Fundamentum truth guard self-test
        run: python tools/fundamentum_truth_guard.py --self-test --output /tmp/fundamentum-truth-guard-self-test.json

      - name: Reject model-only winner at Fundamentum commit threshold
        run: |
          python tools/fundamentum_truth_guard.py --commit-case examples/fundamentum_model_only_commit.json --output /tmp/fundamentum-model-only-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/fundamentum-model-only-result.json').read_text())
          assert result['commit_state'] == 'OPEN_INSUFFICIENT_EVIDENCE'
          assert result['definitive_claim_permitted'] is False
          assert result['witness_ledger_complete'] is True
          PY

      - name: Run human appeal and independent reviewer self-test
        run: python tools/reviewer_appeal_gate.py --self-test --output /tmp/reviewer-appeal-self-test.json

      - name: Verify appeal never creates automatic effect authority
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from reviewer_appeal_gate import self_test
          result = self_test()
          assert result['status'] == 'PASS'
          assert result['checks']['consensus_correction_is_not_auto_applied'] is True
          assert result['checks']['independent_disagreement_is_preserved'] is True
          assert result['checks']['same_root_does_not_count_twice'] is True
          print('APPEAL_REVIEWER_LEDGER=PASS')
          print('AUTOMATIC_WORLD_EFFECT=false')
          PY

      - name: Verify frozen adversarial holdout hash before execution
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from truth_guard_holdout import load_frozen_corpus
          corpus = load_frozen_corpus(Path('holdout/truth_guard_v1/frozen_corpus.json'))
          assert corpus['freeze_sha256'] == '4c658ea1532042e2c5db0298285335bbbb9e3e61ab21afd453ff0c846971201f'
          assert corpus['freeze_payload']['case_count'] == 17
          assert corpus['freeze_payload']['frozen_before_first_execution'] is True
          print('FROZEN_BEFORE_EXECUTION=true')
          print('FREEZE_SHA256', corpus['freeze_sha256'])
          PY

      - name: Run frozen adversarial truth-guard holdout
        run: |
          python tools/truth_guard_holdout.py --corpus holdout/truth_guard_v1/frozen_corpus.json --output /tmp/truth-guard-holdout-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/truth-guard-holdout-result.json').read_text(encoding='utf-8'))
          assert result['status'] == 'PASS'
          assert result['passed'] == 17
          assert result['total'] == 17
          assert result['independent_external_validation'] is False
          assert result['real_world_reviewer_independence_established'] is False
          assert result['universal_truthfulness_established'] is False
          assert result['production_readiness_established'] is False
          print('FROZEN_SYNTHETIC_ADVERSARIAL_HOLDOUT=PASS')
          print('INDEPENDENT_EXTERNAL_VALIDATION=false')
          PY
