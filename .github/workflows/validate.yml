name: Validate repository contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate contracts and documentation
        run: python tools/validate_repository.py

      - name: Run reference tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic KETO fixture
        run: python tools/keto_reference.py examples/case_echo_collapse.json --output /tmp/keto-result.json

      - name: Run deterministic flow-gate self-test
        run: python tools/flow_gate.py --self-test --output /tmp/flow-gate-self-test.json

      - name: Run deterministic flow-gate fixture
        run: python tools/flow_gate.py examples/flow_gate_trace.json --output /tmp/flow-gate-result.json

      - name: Run constitution-bound optimizer self-test
        run: python tools/constitution_optimizer.py --self-test --output /tmp/optimizer-self-test.json

      - name: Run frozen operational optimizer fixture
        run: python tools/constitution_optimizer.py examples/optimizer_trials.json --output /tmp/optimizer-result.json

      - name: Run deterministic +/+ recenter self-test
        run: python tools/plus_plus_recenter.py --self-test --output /tmp/plus-plus-self-test.json

      - name: Run deterministic +/+ recenter trace
        run: python tools/plus_plus_recenter.py --input-csv examples/plus_plus_recenter_trace.csv --output /tmp/plus-plus-trace.json

      - name: Run deterministic Third Wish activation self-test
        run: python tools/third_wish_catalog.py --self-test --output /tmp/third-wish-self-test.json

      - name: Inspect high-impact Third Wish hold path
        run: python tools/third_wish_catalog.py --request GITHUB.DESTRUCTIVE --output /tmp/third-wish-high-impact.json
