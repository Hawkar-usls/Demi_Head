name: Validate repository contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate contracts and documentation
        run: python tools/validate_repository.py

      - name: Run reference tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic KETO fixture
        run: python tools/keto_reference.py examples/case_echo_collapse.json --output /tmp/keto-result.json

      - name: Run deterministic +/+ recenter self-test
        run: python tools/plus_plus_recenter.py --self-test --output /tmp/plus-plus-self-test.json

      - name: Run deterministic +/+ recenter trace
        run: python tools/plus_plus_recenter.py --input-csv examples/plus_plus_recenter_trace.csv --output /tmp/plus-plus-trace.json

      - name: Run deterministic Third Wish activation self-test
        run: python tools/third_wish_catalog.py --self-test --output /tmp/third-wish-self-test.json

      - name: Inspect high-impact Third Wish hold path
        run: python tools/third_wish_catalog.py --request GITHUB.DESTRUCTIVE --output /tmp/third-wish-high-impact.json

      - name: Run epistemic execution gate self-test
        run: python tools/epistemic_execution_gate.py --self-test --output /tmp/epistemic-execution-self-test.json

      - name: Reject model-only fake hash verification fixture
        run: |
          python tools/epistemic_execution_gate.py --assess examples/epistemic_model_only_hash_claim.json --output /tmp/model-only-hash-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/model-only-hash-result.json').read_text())
          assert result['evidence_state'] == 'EVIDENCE_INSUFFICIENT'
          assert result['definitive_claim_permitted'] is False
          assert 'DO_NOT_GUESS_A_VALUE' in result['response_policy']
          PY

      - name: Exercise real SHA-256 execution path
        run: python tools/epistemic_execution_gate.py --sha256-text JANUS --output /tmp/real-sha256-receipt.json

      - name: Run Fundamentum truth guard self-test
        run: python tools/fundamentum_truth_guard.py --self-test --output /tmp/fundamentum-truth-guard-self-test.json

      - name: Reject model-only winner at Fundamentum commit threshold
        run: |
          python tools/fundamentum_truth_guard.py --commit-case examples/fundamentum_model_only_commit.json --output /tmp/fundamentum-model-only-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/fundamentum-model-only-result.json').read_text())
          assert result['commit_state'] == 'OPEN_INSUFFICIENT_EVIDENCE'
          assert result['definitive_claim_permitted'] is False
          assert result['witness_ledger_complete'] is True
          PY

      - name: Run human appeal and independent reviewer self-test
        run: python tools/reviewer_appeal_gate.py --self-test --output /tmp/reviewer-appeal-self-test.json

      - name: Verify appeal never creates automatic effect authority
        run: |
          python - <<'PY'
          from tools.reviewer_appeal_gate import self_test
          result = self_test()
          assert result['status'] == 'PASS'
          assert result['checks']['consensus_correction_is_not_auto_applied'] is True
          assert result['checks']['independent_disagreement_is_preserved'] is True
          assert result['checks']['same_root_does_not_count_twice'] is True
          print('APPEAL_REVIEWER_LEDGER=PASS')
          print('AUTOMATIC_WORLD_EFFECT=false')
          PY
