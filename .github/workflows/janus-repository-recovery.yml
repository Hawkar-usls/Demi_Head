name: JANUS repository backup and clean recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '19 2 * * *'
  pull_request:
    paths:
      - 'tools/janus_repository_recovery.py'
      - 'tools/publish_janus_recovery_receipt.py'
      - 'tests/test_janus_repository_recovery.py'
      - '.github/workflows/janus-repository-recovery.yml'

permissions:
  contents: read
concurrency:
  group: janus-repository-recovery-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'backup' }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python -m unittest discover -s tests -p test_janus_repository_recovery.py -v
  backup:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preserve all public Git refs and restore into an empty repository
        run: python tools/janus_repository_recovery.py --output "$RUNNER_TEMP/janus-recovery"
      - name: Exercise restored Beetle contracts without host execution or network
        shell: bash
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null -c core.symlinks=false clone --quiet "$RUNNER_TEMP/janus-recovery/janus-demiurge.bundle" "$RUNNER_TEMP/restored-janus"
          docker pull python:3.12-slim
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 512m --cpus 1 --user 65534:65534 --tmpfs /tmp:rw,noexec,nosuid,size=128m -e PYTHONDONTWRITEBYTECODE=1 -e HOME=/tmp -v "$RUNNER_TEMP/restored-janus:/repo:ro" -w /repo python:3.12-slim python -m unittest discover -s tests -p test_beetle_runtime_consumer.py -v 2>&1 | tee "$RUNNER_TEMP/janus-recovery/restored-beetle-tests.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'janus-recovery/manifest.json'
          value = json.loads(p.read_text())
          value['functional_drill'] = {'status': 'PASSED', 'suite': 'test_beetle_runtime_consumer.py', 'network': 'none', 'read_only_source': True, 'host_execution': False}
          p.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True, indent=2) + '\n')
          PY
      - name: Store the verified snapshot in Demi_Head
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: janus-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/janus-recovery/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Append public receipt after successful artifact storage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: python tools/publish_janus_recovery_receipt.py "$RUNNER_TEMP/janus-recovery/manifest.json"
