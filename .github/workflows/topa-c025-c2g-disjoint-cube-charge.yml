name: Validate TOPA C025-C2G Disjoint Cube Charge

on:
  push:
    branches: [main]
    paths:
      - 'docs/TOPA_C025_C2G_DISJOINT_CUBE_CHARGE_CANDIDATE.md'
      - 'fixtures/topa_c025_c2g_disjoint_cube_charge.py'
      - '.github/workflows/topa-c025-c2g-disjoint-cube-charge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/TOPA_C025_C2G_DISJOINT_CUBE_CHARGE_CANDIDATE.md'
      - 'fixtures/topa_c025_c2g_disjoint_cube_charge.py'
      - '.github/workflows/topa-c025-c2g-disjoint-cube-charge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-c2g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile C2G replay
        run: python -m py_compile fixtures/topa_c025_c2g_disjoint_cube_charge.py
      - name: Replay disjoint cube charge mechanics
        run: python fixtures/topa_c025_c2g_disjoint_cube_charge.py
