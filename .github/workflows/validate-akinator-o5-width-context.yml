name: Validate Akinator O5 Width Context

on:
  push:
    paths:
      - 'probes/akinator_o5_width_context_probe.py'
      - 'docs/TOPA_AKINATOR_O5_WIDTH_CONTEXT_THEOREM.md'
      - 'docs/TOPA_PVSNP_EVENT_JOURNAL_2026-08-25.json'
      - '.github/workflows/validate-akinator-o5-width-context.yml'
  pull_request:
    paths:
      - 'probes/akinator_o5_width_context_probe.py'
      - 'docs/TOPA_AKINATOR_O5_WIDTH_CONTEXT_THEOREM.md'
      - 'docs/TOPA_PVSNP_EVENT_JOURNAL_2026-08-25.json'
      - '.github/workflows/validate-akinator-o5-width-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run O5 width/context replay
        run: python probes/akinator_o5_width_context_probe.py
      - name: Validate JSON journal
        run: python -m json.tool docs/TOPA_PVSNP_EVENT_JOURNAL_2026-08-25.json >/dev/null
      - name: Claim ceiling reminder
        run: |
          echo 'CI validates finite mechanics only.'
          echo 'External asymptotic lower bounds remain source-derived theorems.'
          echo 'P_VS_NP = OPEN'
