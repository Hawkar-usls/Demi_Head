name: Diagnose Nexus storage fault gate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run storage fault suite with forensic annotation
        shell: bash
        run: |
          set +e
          python tests/test_nexus_storage_fault_gate.py -v 2>&1 | tee /tmp/storage-fault-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/storage-fault-tests.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-12000:]
          escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::error title=Nexus storage fault suite failure::{escaped}")
          PY
            exit "$status"
          fi
