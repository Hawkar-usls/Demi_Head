name: DemiHead TACHYON R5F - Stock Mirrored Reverse

on:
  pull_request:
    paths:
      - 'tools/tachyon_r5f_stock_mirror_audit.py'
      - 'tests/test_tachyon_r5f_stock_mirror_audit.py'
      - 'research/tachyon/r5f_stock_mirror_protocol_20261122.json'
      - 'research/tachyon/r5f_stock_mirror_result_20261122.json'
      - '.github/workflows/tachyon-r5f-stock-mirror.yml'
  push:
    branches:
      - research/tachyon-r5f-stock-mirror-reverse-20261122
      - main
    paths:
      - 'tools/tachyon_r5f_stock_mirror_audit.py'
      - 'tests/test_tachyon_r5f_stock_mirror_audit.py'
      - 'research/tachyon/r5f_stock_mirror_protocol_20261122.json'
      - 'research/tachyon/r5f_stock_mirror_result_20261122.json'
      - '.github/workflows/tachyon-r5f-stock-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-stock-causal-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validated repository requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Validate original DemiHead and unchanged stock R5F
        run: |
          set -euo pipefail
          python tools/validate_repository.py
          python -m unittest discover -s tests -p 'test_keto_reference.py' -v
          python -m unittest discover -s tests -p 'test_tachyon_r5f_causal_memory_audit.py' -v
          test "$(git hash-object tools/tachyon_r5f_causal_memory_audit.py)" = "ea3ebbbd14594291adcde4f403a7e040d65f76a3"
      - name: Test stock mirrored C to B to A graph inversion
        run: python -m unittest discover -s tests -p 'test_tachyon_r5f_stock_mirror_audit.py' -v
      - name: Execute 600 case mirrored stock exam, freeze receipt
        run: |
          set -euo pipefail
          mkdir -p out/tachyon
          python -m tools.tachyon_r5f_stock_mirror_audit --audit > out/tachyon/r5f_stock_mirror_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/tachyon/r5f_stock_mirror_protocol_20261122.json").read_text())
          r=json.loads(Path("out/tachyon/r5f_stock_mirror_receipt.json").read_text())
          assert r["stock_budget_operations_per_case"] == p["stock_parameters"]["operation_budget_per_case"] == 500
          assert r["stock_graph_edges_per_case"] == p["stock_parameters"]["graph_forward_edges_per_case"] == 9
          assert r["challenge_cases"] == 600 and r["scenario_count"] == 15
          assert r["prior_negative999_gate_not_applied"] and r["prior_x100_expansion_not_applied"]
          assert r["physical_UTC_unchanged_cases"] == 600
          assert r["original_forward_vs_exact_mirror_predictions_equal_cases"] == 600
          assert r["original_reverse_replay_vs_mirror_replay_predictions_equal_cases"] == 600
          assert r["total_nonabstention_unsafe"] == 0
          assert not r["real_physical_time_reversal"]
          assert not r["neural_training_or_production_weights_changed"]
          assert not r["external_custodian"]
          for name,v in r["arms"].items():
              assert v["budget_exceeded_cases"] == 0
              print("R5F_MIRROR_ARM="+name+
                    ",answered="+str(v["answered"])+
                    ",coverage="+str(v["coverage"])+
                    ",selective_accuracy="+str(v["selective_accuracy"])+
                    ",mean_ops="+str(v["mean_counted_operations_per_case"])+
                    ",median_us="+str(v["median_runtime_microseconds_single_runner"]))
          print("R5F_STOCK_MIRROR_600_CASE_INVARIANCE_PASS__SCIENCE_HOLD")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: demihead-tachyon-r5f-stock-mirror-reverse
          path: out/tachyon/r5f_stock_mirror_receipt.json
          if-no-files-found: error
          retention-days: 60
