name: Validate Akinator O7 Schema Selection

on:
  push:
    paths:
      - 'probes/akinator_o7_schema_selection_barrier_probe.py'
      - 'docs/TOPA_AKINATOR_O7_SCHEMA_SELECTION_BARRIERS.md'
      - 'docs/TOPA_PVSNP_EVENT_JOURNAL_2026-08-25.json'
      - '.github/workflows/validate-akinator-o7-schema-selection.yml'
  pull_request:
    paths:
      - 'probes/akinator_o7_schema_selection_barrier_probe.py'
      - 'docs/TOPA_AKINATOR_O7_SCHEMA_SELECTION_BARRIERS.md'
      - 'docs/TOPA_PVSNP_EVENT_JOURNAL_2026-08-25.json'
      - '.github/workflows/validate-akinator-o7-schema-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run O7 schema-selection barrier replay
        run: python probes/akinator_o7_schema_selection_barrier_probe.py
      - name: Validate JSON journal
        run: python -m json.tool docs/TOPA_PVSNP_EVENT_JOURNAL_2026-08-25.json >/dev/null
      - name: Claim ceiling reminder
        run: |
          echo 'CI validates finite selector-lift and sequence-count mechanics only.'
          echo 'coNP-completeness is analytical; cryptographic proof-search barriers are conditional external results.'
          echo 'Universal proof-carrying B2 selector remains OPEN.'
          echo 'P_VS_NP = OPEN'
