name: DemiHead NOHAND Habitat Peer v1.5.1 Resilient

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nohand-habitat-peer-v1
    paths:
      - 'habitat/nohand/v1_5_1/inbox/**'
      - 'habitat/nohand/v1_5_1/outcomes/**'
      - 'tools/nohand_habitat_peer_v1_5_1_resilient.py'
      - '.github/workflows/nohand-habitat-peer-v1-5-1-resilient.yml'

permissions:
  contents: write

concurrency:
  group: demihead-nohand-habitat-peer-v1-5-1-resilient
  cancel-in-progress: false

jobs:
  peer-resilient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nohand-habitat-peer-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile resilient guard
        run: python -m py_compile tools/goldprompt_handshake.py tools/nohand_habitat_peer.py tools/nohand_habitat_peer_v1_5_1.py tools/nohand_habitat_peer_v1_5_1_resilient.py
      - name: Resilient self-test
        run: python tools/nohand_habitat_peer_v1_5_1_resilient.py --self-test
      - name: Process orphan-safe exchange
        env:
          JANUS_PEER_SOURCE_REVISION: ${{ github.sha }}
        run: python tools/nohand_habitat_peer_v1_5_1_resilient.py --root .
      - name: Commit create-only artifacts
        shell: bash
        run: |
          git config user.name 'janus-demihead-peer'
          git config user.email 'janus-demihead-peer@users.noreply.github.com'
          for path in habitat/nohand/v1_5_1/outbox habitat/nohand/v1_5_1/settled habitat/nohand/v1_5_1/state; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo 'No allowed resilient artifacts to commit.'
            exit 0
          fi
          git commit -m 'janus(demihead): resiliently process pinned NOHAND v1.5.1 exchange'
          git push origin HEAD:feature/nohand-habitat-peer-v1
