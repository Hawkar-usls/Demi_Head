name: DemiHead TACHYON R5C - Observation Native Learning

on:
  pull_request:
    paths:
      - 'tools/tachyon_r5c_observation_native_train.py'
      - 'tests/test_tachyon_r5c_observation_native_train.py'
      - 'research/tachyon/r5c_observation_native_protocol_20261122.json'
      - 'research/tachyon/r5c_observation_native_result_20261122.json'
      - '.github/workflows/tachyon-r5c-observation-native.yml'
  push:
    branches:
      - research/tachyon-r5c-observation-native-learning-20261122
      - main
    paths:
      - 'tools/tachyon_r5c_observation_native_train.py'
      - 'tests/test_tachyon_r5c_observation_native_train.py'
      - 'research/tachyon/r5c_observation_native_protocol_20261122.json'
      - 'research/tachyon/r5c_observation_native_result_20261122.json'
      - '.github/workflows/tachyon-r5c-observation-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-native-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checked-in DemiHead validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate unchanged original DemiHead reference and R5B control
        run: |
          python tools/validate_repository.py
          python -m unittest discover -s tests -p 'test_keto_reference.py' -v
          python -m unittest discover -s tests -p 'test_tachyon_r5b_witness_audit.py' -v
          test "$(git hash-object tools/tachyon_r5b_witness_audit.py)" = "5f462b79177ca5fcb86f4e8c14266e0ead3078a8"
      - name: Execute R5C observation-native training contract tests
        run: python -m unittest discover -s tests -p 'test_tachyon_r5c_observation_native_train.py' -v
      - name: Train R5C on development and evaluate locked synthetic holdout
        run: |
          set -euo pipefail
          mkdir -p out/tachyon
          python -m tools.tachyon_r5c_observation_native_train --train-and-audit > out/tachyon/r5c_observation_native_training_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("out/tachyon/r5c_observation_native_training_receipt.json").read_text())
          p=json.loads(Path("research/tachyon/r5c_observation_native_protocol_20261122.json").read_text())
          assert r["train_cases"] == p["split_and_model"]["train_examples"] == 800
          assert r["validation_cases"] == p["split_and_model"]["validation_examples"] == 200
          assert r["test_cases"] == p["split_and_model"]["test_examples"] == 320
          assert r["root_seed"] == p["split_and_model"]["seed"]
          assert r["source_root_split_disjoint"]
          assert r["r5b_rule_baseline_blob_sha"] == "5f462b79177ca5fcb86f4e8c14266e0ead3078a8"
          assert r["original_demihead_reference_outputs_preserved"] == 320
          assert not r["external_custodian"] and not r["real_world_witnesses"]
          assert not r["human_or_clinical_data"] and not r["production_weights_changed"]
          assert not r["automatic_model_adoption"] and not r["physical_retrocausality_proven"]
          print("R5C_TRAIN_CASES=" + str(r["train_cases"]))
          print("R5C_VALIDATION_CASES=" + str(r["validation_cases"]))
          print("R5C_HELDOUT_CASES=" + str(r["test_cases"]))
          print("R5C_CALIBRATED_THRESHOLD=" + str(r["validation_only_selected_threshold"]))
          for arm, stat in r["arms"].items():
              print("R5C_ARM=" + arm + ",coverage=" + str(stat["coverage"]) +
                    ",selective_accuracy=" + str(stat["selective_accuracy"]) +
                    ",unsupported=" + str(stat["unsupported_assertions"]) +
                    ",median_us=" + str(stat["median_decision_us"]))
          print("R5C_SYNTHETIC_GAIN_FLAG=" + str(r["strict_positive_learned_gain_on_heldout"]))
          print("R5C_OBSERVATION_NATIVE_TRAINING_ENGINEERING_PASS__SCIENCE_HOLD")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: demihead-tachyon-r5c-observation-native-training
          path: out/tachyon/r5c_observation_native_training_receipt.json
          if-no-files-found: error
          retention-days: 60
